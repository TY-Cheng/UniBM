name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Sync development environment
        run: uv sync --locked --dev

      - name: Run unit tests with coverage
        run: uv run pytest -n auto --cov=src/unibm --cov-report=term-missing --cov-fail-under=89

      - name: Verify native acceleration was built
        run: uv run python -c "from unibm.evi._accelerator import kernels; assert kernels is not None"

      - name: Verify native acceleration is disabled for fallback checks
        env:
          UNIBM_NO_EXTENSIONS: "1"
        run: uv run --no-sync python -c "from unibm.evi._accelerator import kernels; assert kernels is None"

      - name: Run the pure Python fallback suite
        env:
          UNIBM_NO_EXTENSIONS: "1"
        run: uv run --no-sync pytest -n auto --ignore=tests/test_distribution_artifacts.py

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Sync development environment
        run: uv sync --locked --dev

      - name: Build MkDocs site
        run: uv run mkdocs build --strict
